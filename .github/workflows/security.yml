name: security

# Scans run as pip-installed CLIs rather than third-party marketplace actions.
#
# The previous version pinned aquasecurity/trivy-action at a tag that does not
# exist, so every job failed before scanning anything -- a red tick that said
# nothing about the code. Actions also pull an unreviewed dependency into a job
# that has repository write scope, which is a strange trade for a linter.
#
# SARIF upload to the Security tab needs GitHub Advanced Security on private
# repositories, so results go to the job summary and the exit code instead.
# Those work everywhere and cannot silently degrade into a green tick.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install checkov==3.3.8

      # .checkov.yaml lists every suppressed check with the reason it does not
      # apply. Anything not on that list fails this job.
      - name: Scan Terraform
        run: |
          set -o pipefail
          checkov --config-file .checkov.yaml --output cli | tee checkov.txt

      - name: Scan the bootstrap CloudFormation
        run: |
          set -o pipefail
          checkov -f bootstrap/cloudformation.yaml --framework cloudformation \
            --compact --quiet --skip-download --output cli | tee -a checkov.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Checkov'
            echo '```'
            tail -40 checkov.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pip-audit==2.10.1

      # Fails on any known advisory. The Lambda functions ship no dependencies
      # at all, so this covers the CI toolchain -- which still runs with
      # repository credentials and is worth keeping current.
      - name: Audit Python dependencies
        run: |
          set -o pipefail
          pip-audit -r requirements-dev.txt --progress-spinner off | tee audit.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## pip-audit'
            echo '```'
            cat audit.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install detect-secrets==1.5.0

      # detect-secrets-hook, not `detect-secrets scan --baseline`. The latter
      # rewrites the baseline as a side effect, so any check that compares the
      # file against the committed one reports a difference on every run whether
      # or not it found anything. The hook only reads it, and exits non-zero on
      # a secret that is not already recorded.
      #
      # Regenerate the baseline with `make secrets-baseline` after auditing
      # whatever it found.
      - name: Scan working tree
        run: |
          set -o pipefail
          git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline || {
            echo "::error::detect-secrets found something not in .secrets.baseline. Review it; if it is a false positive, regenerate the baseline with 'make secrets-baseline'."
            exit 1
          }

      # A committed secret stays in history after it is deleted from the tip,
      # so the tip-only scan above is not sufficient on its own.
      - name: Scan history
        run: |
          set -o pipefail
          git rev-list --all | while read -r sha; do
            git grep -I --no-color -n -E 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' "$sha" -- || true
          done | tee history.txt

          if [ -s history.txt ]; then
            echo "::error::Found what looks like a credential in git history."
            exit 1
          fi
          echo "No AWS access keys or private keys in history."
