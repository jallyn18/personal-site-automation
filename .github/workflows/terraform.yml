name: terraform

# Plan on every pull request, apply on merge to the default branch.
#
# Authentication is OIDC only: the job exchanges a short-lived GitHub token for
# AWS credentials. There are no access keys in this repository's secrets.

on:
  # No paths filter on pull_request, deliberately.
  #
  # `plan` is a required status check on main. A required check that never runs
  # because a path filter excluded it leaves the pull request waiting forever:
  # GitHub cannot tell "this check does not apply here" apart from "this check
  # has not finished yet", so it blocks on a status that will never arrive.
  #
  # Planning on every pull request costs about a minute and proves the change
  # does not touch infrastructure. That is worth more than the minute.
  pull_request:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "lambdas/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token
  pull-requests: write   # required to post the plan comment

# Regions are resolved inline at each use rather than hoisted into `env:` here.
# Workflow-level env has restricted context access, and an expression that
# silently resolves to empty is worse than a repeated one: the backend quietly
# falls back to the credentials region and S3 answers the cross-region request
# with a 301 the SDK will not follow. The state bucket's region is discovered
# from the bucket itself, not configured -- see scripts/resolve-config.sh.
#
# Values that embed the AWS account id are read as `secrets.X || vars.X`.
#
# Not because they are confidential -- an account id is not a secret, and these
# were repository variables on purpose so they are visible and editable. It is
# that secret masking is the *only* mechanism that redacts a value in a step's
# own header. The runner prints `role-to-assume:` and a step's `env:` block
# before the step runs, so no ::add-mask:: registered by our own script can
# arrive in time. On a public repository those headers are world-readable.
#
# The `|| vars.X` fallback keeps the workflow working if the secret has not been
# created yet. Once it has, delete the variable -- while both exist the secret
# wins and the value is masked, but the variable is the thing that would leak if
# the secret were ever removed.
env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"

# Never let two applies touch the same state at once. Plans are cancellable;
# an in-flight apply is not.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # No backend, no credentials: this is a pure syntax and type check, so it
      # runs even on pull requests from forks.
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: terraform validate
        run: terraform validate -no-color
        working-directory: terraform

      - name: terraform validate (bootstrap)
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
        working-directory: terraform/bootstrap

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: validate
    # Fork PRs cannot assume the role, and should not be able to.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve configuration
        id: config
        run: ./scripts/resolve-config.sh
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
          AWS_OIDC_PROVIDER_ARN: ${{ secrets.AWS_OIDC_PROVIDER_ARN || vars.AWS_OIDC_PROVIDER_ARN }}
          DEPLOY_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}" \
            -backend-config="key=personal-site/terraform.tfstate" \
            -backend-config="region=${{ steps.config.outputs.state_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        working-directory: terraform

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=ci.tfvars \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="domain_name=${{ vars.DOMAIN_NAME }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="existing_oidc_provider_arn=${{ secrets.AWS_OIDC_PROVIDER_ARN || vars.AWS_OIDC_PROVIDER_ARN }}" \
            -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        working-directory: terraform

      - name: Render plan summary
        if: always()
        run: |
          {
            echo '## Terraform plan'
            echo
            echo '```terraform'
            terraform show -no-color tfplan 2>/dev/null | head -300 || echo '(plan unavailable)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: terraform

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

      # The plan file references the exact state it was generated against, so
      # apply replays this artifact rather than re-planning against a moved target.
      #
      # The Lambda zips travel with it. archive_file writes them during plan and
      # the plan records their hashes, but apply runs on a different runner --
      # rebuilding them there would upload bytes the plan never hashed, and not
      # shipping them at all means apply cannot find the files it is supposed to
      # upload.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: tfplan
          path: |
            terraform/tfplan
            terraform/build/
          retention-days: 5

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Add required reviewers to this environment in repo settings to gate applies.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-terraform-apply-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve configuration
        id: config
        run: ./scripts/resolve-config.sh
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
          AWS_OIDC_PROVIDER_ARN: ${{ secrets.AWS_OIDC_PROVIDER_ARN || vars.AWS_OIDC_PROVIDER_ARN }}
          DEPLOY_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}" \
            -backend-config="key=personal-site/terraform.tfstate" \
            -backend-config="region=${{ steps.config.outputs.state_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        working-directory: terraform

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
        working-directory: terraform

      # The bucket name is deliberately not published here. It embeds the AWS
      # account id, and a step summary is not covered by the log masking that
      # resolve-config.sh registers -- ::add-mask:: filters logs, not summaries.
      # On a public repository this page is world-readable. `terraform output`
      # has the value for anyone who can already assume the role.
      - name: Publish outputs
        run: |
          {
            echo '## Applied'
            echo
            echo '| Output | Value |'
            echo '| --- | --- |'
            echo "| Site | $(terraform output -raw site_url) |"
            echo "| Distribution | $(terraform output -raw distribution_id) |"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: terraform
